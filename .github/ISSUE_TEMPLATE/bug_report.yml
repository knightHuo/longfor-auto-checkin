name: 故障反馈
description: 报告安装、面板或签到流程中的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请使用虚构数据或已脱敏的日志。不要上传 Token、设备标识、PushPlus 密钥、cURL、HAR 或数据库。
        真实签到、奖励到账和验证码是否通过，需要分别说明；请勿把接口可查询当作已成功领奖。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 例如 main 的提交号，或镜像标签
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python / Docker Compose 版本、是否使用反向代理；无需提供公网 IP。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤、预期和实际结果
      description: 涉及签到时请分别说明小程序和 App 的状态，并注明是否已在官方端核对。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我确认未包含任何登录凭据、设备标识、推送密钥或原始抓包数据。
          required: true
